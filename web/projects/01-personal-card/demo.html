<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人名片组件 Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .dark .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }
        .hover-scale {
            transition: transform 0.2s ease-in-out;
        }
        .hover-scale:hover {
            transform: scale(1.05);
        }
        .copy-btn {
            transition: all 0.2s ease-in-out;
        }
        .copy-btn:hover {
            background-color: rgba(59, 130, 246, 0.1);
        }
        .theme-transition {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen py-12 px-4 theme-transition">
    <div class="max-w-6xl mx-auto">
        <!-- 标题 -->
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold text-gray-900 dark:text-white mb-4">个人名片组件 Demo</h1>
            <p class="text-lg text-gray-600 dark:text-gray-300">支持明暗主题切换的响应式个人名片组件</p>
            
            <!-- 主题切换按钮 -->
            <button id="themeToggle" class="mt-6 px-6 py-3 bg-primary-500 hover:bg-primary-600 text-white rounded-lg transition-colors duration-200 flex items-center gap-2 mx-auto">
                <i class="fas fa-moon dark:hidden"></i>
                <i class="fas fa-sun hidden dark:inline"></i>
                <span class="dark:hidden">切换到暗色主题</span>
                <span class="hidden dark:inline">切换到亮色主题</span>
            </button>
        </div>

        <!-- 桌面端布局展示 -->
        <div class="mb-16">
            <h2 class="text-2xl font-semibold text-gray-900 dark:text-white mb-6 text-center">桌面端布局</h2>
            
            <!-- 个人名片 - 横向布局 -->

                    <!-- 头像部分 -->
                    <div class="flex-shrink-0">
                        <div class="relative">
                            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&h=150&fit=crop&crop=face" 
                                 alt="张三" 
                                 class="w-32 h-32 rounded-full object-cover border-4 border-primary-500 hover-scale">
                            <div class="absolute -bottom-2 -right-2 w-8 h-8 bg-green-500 rounded-full border-4 border-white dark:border-gray-800 flex items-center justify-center theme-transition">
                                <i class="fas fa-check text-white text-xs"></i>
                            </div>
                        </div>
                    </div>

                    <!-- 信息部分 -->
                    <div class="flex-1 text-center lg:text-left">
                        <!-- 基本信息 -->
                        <div class="mb-6">
                            <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">张三</h1>
                            <p class="text-xl text-primary-600 dark:text-primary-400 mb-1">高级前端工程师</p>
                            <p class="text-lg text-gray-600 dark:text-gray-300">阿里巴巴集团</p>
                        </div>

                        <!-- 联系信息 -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                            <div class="flex items-center justify-center lg:justify-start gap-3 p-3 rounded-lg bg-gray-50 dark:bg-gray-700 copy-btn cursor-pointer theme-transition">
                                <i class="fas fa-envelope text-primary-500"></i>
                                <span class="text-gray-700 dark:text-gray-300">zhang.san@example.com</span>
                                <i class="fas fa-copy text-gray-400 text-sm"></i>
                            </div>
                            <div class="flex items-center justify-center lg:justify-start gap-3 p-3 rounded-lg bg-gray-50 dark:bg-gray-700 copy-btn cursor-pointer theme-transition">
                                <i class="fas fa-phone text-primary-500"></i>
                                <span class="text-gray-700 dark:text-gray-300">+86 138-0013-8000</span>
                                <i class="fas fa-copy text-gray-400 text-sm"></i>
                            </div>
                            <div class="flex items-center justify-center lg:justify-start gap-3 p-3 rounded-lg bg-gray-50 dark:bg-gray-700 copy-btn cursor-pointer theme-transition">
                                <i class="fas fa-map-marker-alt text-primary-500"></i>
                                <span class="text-gray-700 dark:text-gray-300">北京市朝阳区</span>
                                <i class="fas fa-copy text-gray-400 text-sm"></i>
                            </div>
                        </div>

                        <!-- 社交链接 -->
                        <div class="flex justify-center lg:justify-start gap-4">
                            <a href="#" class="w-12 h-12 bg-gray-900 dark:bg-gray-600 text-white rounded-full flex items-center justify-center hover-scale theme-transition">
                                <i class="fab fa-github"></i>
                            </a>
                            <a href="#" class="w-12 h-12 bg-blue-600 text-white rounded-full flex items-center justify-center hover-scale">
                                <i class="fab fa-linkedin"></i>
                            </a>
                            <a href="#" class="w-12 h-12 bg-blue-400 text-white rounded-full flex items-center justify-center hover-scale">
                                <i class="fab fa-twitter"></i>
                            </a>
                            <a href="#" class="w-12 h-12 bg-gray-600 text-white rounded-full flex items-center justify-center hover-scale">
                                <i class="fas fa-globe"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 移动端布局展示 -->
        <div class="mb-16">
            <h2 class="text-2xl font-semibold text-gray-900 dark:text-white mb-6 text-center">移动端布局</h2>
            
            <!-- 个人名片 - 纵向布局 -->
            <div class="max-w-sm mx-auto bg-white dark:bg-gray-800 rounded-2xl card-shadow p-6 theme-transition">
                <!-- 头像部分 -->
                <div class="text-center mb-6">
                    <div class="relative inline-block">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120&h=120&fit=crop&crop=face" 
                             alt="张三" 
                             class="w-24 h-24 rounded-full object-cover border-4 border-primary-500 hover-scale mx-auto">
                        <div class="absolute -bottom-1 -right-1 w-6 h-6 bg-green-500 rounded-full border-3 border-white dark:border-gray-800 flex items-center justify-center theme-transition">
                            <i class="fas fa-check text-white text-xs"></i>
                        </div>
                    </div>
                </div>

                <!-- 基本信息 -->
                <div class="text-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">张三</h1>
                    <p class="text-lg text-primary-600 dark:text-primary-400 mb-1">高级前端工程师</p>
                    <p class="text-gray-600 dark:text-gray-300">阿里巴巴集团</p>
                </div>

                <!-- 联系信息 -->
                <div class="space-y-3 mb-6">
                    <div class="flex items-center gap-3 p-3 rounded-lg bg-gray-50 dark:bg-gray-700 copy-btn cursor-pointer theme-transition">
                        <i class="fas fa-envelope text-primary-500"></i>
                        <span class="text-gray-700 dark:text-gray-300 text-sm">zhang.san@example.com</span>
                        <i class="fas fa-copy text-gray-400 text-xs ml-auto"></i>
                    </div>
                    <div class="flex items-center gap-3 p-3 rounded-lg bg-gray-50 dark:bg-gray-700 copy-btn cursor-pointer theme-transition">
                        <i class="fas fa-phone text-primary-500"></i>
                        <span class="text-gray-700 dark:text-gray-300 text-sm">+86 138-0013-8000</span>
                        <i class="fas fa-copy text-gray-400 text-xs ml-auto"></i>
                    </div>
                    <div class="flex items-center gap-3 p-3 rounded-lg bg-gray-50 dark:bg-gray-700 copy-btn cursor-pointer theme-transition">
                        <i class="fas fa-map-marker-alt text-primary-500"></i>
                        <span class="text-gray-700 dark:text-gray-300 text-sm">北京市朝阳区</span>
                        <i class="fas fa-copy text-gray-400 text-xs ml-auto"></i>
                    </div>
                </div>

                <!-- 社交链接 -->
                <div class="flex justify-center gap-3">
                    <a href="#" class="w-10 h-10 bg-gray-900 dark:bg-gray-600 text-white rounded-full flex items-center justify-center hover-scale theme-transition">
                        <i class="fab fa-github text-sm"></i>
                    </a>
                    <a href="#" class="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center hover-scale">
                        <i class="fab fa-linkedin text-sm"></i>
                    </a>
                    <a href="#" class="w-10 h-10 bg-blue-400 text-white rounded-full flex items-center justify-center hover-scale">
                        <i class="fab fa-twitter text-sm"></i>
                    </a>
                    <a href="#" class="w-10 h-10 bg-gray-600 text-white rounded-full flex items-center justify-center hover-scale">
                        <i class="fas fa-globe text-sm"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- 功能特性展示 -->
        <div class="text-center">
            <h2 class="text-2xl font-semibold text-gray-900 dark:text-white mb-6">功能特性</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="bg-white dark:bg-gray-800 p-6 rounded-xl card-shadow theme-transition">
                    <i class="fas fa-palette text-3xl text-primary-500 mb-4"></i>
                    <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">主题切换</h3>
                    <p class="text-gray-600 dark:text-gray-300 text-sm">支持明暗主题无缝切换</p>
                </div>
                <div class="bg-white dark:bg-gray-800 p-6 rounded-xl card-shadow theme-transition">
                    <i class="fas fa-mobile-alt text-3xl text-primary-500 mb-4"></i>
                    <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">响应式设计</h3>
                    <p class="text-gray-600 dark:text-gray-300 text-sm">适配桌面端和移动端</p>
                </div>
                <div class="bg-white dark:bg-gray-800 p-6 rounded-xl card-shadow theme-transition">
                    <i class="fas fa-copy text-3xl text-primary-500 mb-4"></i>
                    <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">一键复制</h3>
                    <p class="text-gray-600 dark:text-gray-300 text-sm">点击联系信息快速复制</p>
                </div>
                <div class="bg-white dark:bg-gray-800 p-6 rounded-xl card-shadow theme-transition">
                    <i class="fas fa-share-alt text-3xl text-primary-500 mb-4"></i>
                    <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">社交链接</h3>
                    <p class="text-gray-600 dark:text-gray-300 text-sm">快速跳转到社交平台</p>
                </div>
            </div>
        </div>

        <!-- 复制成功提示 -->
        <div id="copyToast" class="fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg transform translate-x-full transition-transform duration-300">
            <i class="fas fa-check mr-2"></i>
            复制成功！
        </div>
    </div>

    <script>
        // 主题切换功能
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        // 检查本地存储的主题设置
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            html.classList.add('dark');
        }

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // 复制功能
        const copyToast = document.getElementById('copyToast');
        
        function showToast() {
            copyToast.classList.remove('translate-x-full');
            setTimeout(() => {
                copyToast.classList.add('translate-x-full');
            }, 2000);
        }

        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const text = btn.querySelector('span').textContent;
                navigator.clipboard.writeText(text).then(() => {
                    // 视觉反馈
                    btn.style.backgroundColor = 'rgba(34, 197, 94, 0.1)';
                    setTimeout(() => {
                        btn.style.backgroundColor = '';
                    }, 300);
                    
                    // 显示提示
                    showToast();
                }).catch(() => {
                    // 降级方案
                    const textArea = document.createElement('textarea');
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    showToast();
                });
            });
        });

        // 社交链接点击效果
        document.querySelectorAll('a[href="#"]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                alert('这是一个演示链接，实际使用时会跳转到对应的社交平台');
            });
        });

        // 键盘导航支持
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                // 确保焦点可见
                document.body.classList.add('keyboard-navigation');
            }
        });

        document.addEventListener('mousedown', () => {
            document.body.classList.remove('keyboard-navigation');
        });
    </script>

    <style>
        /* 键盘导航样式 */
        .keyboard-navigation *:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }
    </style>
</body>
</html>
